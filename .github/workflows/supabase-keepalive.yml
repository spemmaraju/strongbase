# Pings the Supabase project twice a week so the free tier never sees
# 7 days of inactivity and never pauses the database.
#
# Works out of the box: the project URL and publishable (anon) key are set
# below as defaults. These are public by design — the same values ship in the
# app's browser bundle — and row-level security protects the data. To override
# them (e.g. after rotating keys), add SUPABASE_URL / SUPABASE_ANON_KEY repo
# secrets (Settings → Secrets and variables → Actions); secrets take
# precedence over the defaults.

name: Supabase keep-alive

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC — every 3–4 days, well inside
    # Supabase's 7-day inactivity window. (Odd minute avoids GitHub's
    # congested on-the-hour cron slots.)
    - cron: '17 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://kucebiqstwuybebumnij.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_I3zFz7mxgrxQUDmnlGmh4g_vI7Wmajx' }}
        run: |
          set -euo pipefail
          # A tiny select against the DB counts as activity. RLS may return
          # zero rows for the anon key — that's fine; the query still runs.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            "${SUPABASE_URL}/rest/v1/workout_logs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          cat response.txt
          case "$status" in
            2*) echo "Supabase ping OK" ;;
            *)  echo "::error::Supabase ping failed with HTTP ${status}"; exit 1 ;;
          esac
