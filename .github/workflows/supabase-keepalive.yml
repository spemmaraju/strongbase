# Pings the Supabase project twice a week so the free tier never sees
# 7 days of inactivity and never pauses the database.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL      — e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY — the anon/public key (same values as VITE_SUPABASE_URL
#                       and VITE_SUPABASE_ANON_KEY in your local .env)

name: Supabase keep-alive

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC — every 3–4 days, well inside
    # Supabase's 7-day inactivity window. (Odd minute avoids GitHub's
    # congested on-the-hour cron slots.)
    - cron: '17 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repo secrets are not set."
            exit 1
          fi
          # A tiny select against the DB counts as activity. RLS may return
          # zero rows for the anon key — that's fine; the query still runs.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            "${SUPABASE_URL}/rest/v1/workout_logs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          cat response.txt
          case "$status" in
            2*) echo "Supabase ping OK" ;;
            *)  echo "::error::Supabase ping failed with HTTP ${status}"; exit 1 ;;
          esac
